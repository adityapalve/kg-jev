[project]
name = "kgqa"
version = "0.1.0"
description = "System One routing layer for knowledge graph question answering"
requires-python = ">=3.11"
dependencies = [
    "pyoxigraph>=0.4",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
dev = ["pytest>=8", "typesafe-sdk>=0.7"]

[project.scripts]
kgqa = "kgqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
